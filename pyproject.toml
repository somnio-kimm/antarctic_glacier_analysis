[project]
name = "antarctic-glacier-analysis"
version = "0.1.0"
description = "Deep learning pipeline that predicts future Antarctic glacier distributions from historical satellite time-series imagery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=11.0",
    "opencv-python>=4.10",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "flask>=3.0",
    "tqdm>=4.66",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[project.urls]
Repository = "https://github.com/somnio-kimm/antarctic_glacier_analysis"

[dependency-groups]
dev = [
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM", "W"]
ignore = ["T201"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
